[package]
name = "astraio-client"
version = "0.4.0"
edition = "2021"
authors = ["vant3x"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "canvas", "highlighter"] }
iced_aw = { version = "0.13.1", features = ["tabs", "tab_bar", "context_menu", "spinner"] }


bytes = "1.0.0"
tokio = { version = "1.38.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12.5", features = ["json", "multipart", "rustls-tls", "cookies"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.118"
serde_yaml = "0.9"
md5 = "0.7"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
http = "1.0.0"
url = "2.5"
urlencoding = "2.1.3"

image = "0.25.1"
arboard = "3.2.0"
base64 = "0.22.1"
rusqlite = { version = "0.31.0", features = ["serde_json", "bundled"] }
directories = "5.0.1"
rfd = "0.15"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
futures = { version = "0.3", features = ["alloc"] }
chrono = "0.4"
csv = "1"
iced_futures = "0.14.0"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
regex = "1"
open = "5"
iced_fonts = { version = "0.3.0", features = ["lucide"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
muda = { version = "0.17", default-features = false }
[target.'cfg(target_os = "linux")'.dependencies]
muda = { version = "0.17", features = ["gtk"] }

[dependencies.zbus]
version = ">=5.0, <5.12"
default-features = false
features = ["tokio"]

[build-dependencies]
# Embeds the app icon into the Windows .exe resource section.
# Only used when cross-compiling or building natively on Windows.
winresource = "0.1"

[package.metadata.bundle]
name = "Astraio"
identifier = "com.astraio.client"
icon = ["assets/icon.png", "assets/icon.ico"]
version = "0.2.0"
copyright = "Copyright (C) Astraio 2026"
category = "Developer Tool"
short_description = "A simple HTTP client."

[package.metadata.bundle.mac_os_x]
icon = ["assets/icon.icns"]

[package.metadata.bundle.windows]
icon = ["assets/icon.ico"]

osx_frameworks = []
osx_minimum_system_version = "10.11"
windows_console_mode = false  

deb_depends = [
    "libxkbcommon0", 
    "libwayland-client0",
    "libxrandr2",
    "libxcursor1",
    "libxi6",
    "libxinerama1"
]

license = "MIT" 
homepage = "https://astraio.vercel.app/"
repository = "https://github.com/vant3x/astraio-client" 

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
